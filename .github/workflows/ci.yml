# PATH: .github/workflows/ci.yml
# PURPOSE: Continuous Integration pipeline for R&D Alpha Research
# TRIGGERS: Push to main/develop, Pull Requests

name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ==========================================================================
  # Backend Tests
  # ==========================================================================
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
          python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Cache pip packages
        uses: actions/cache@v4
      with:
        path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov pytest-asyncio
    
      - name: Run backend tests
      env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db
        SECRET_KEY: test-secret-key
          DEBUG: "true"
      run: |
          cd backend
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing
    
    - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.xml
          flags: backend
          name: backend-coverage

  # ==========================================================================
  # Frontend Build
  # ==========================================================================
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
      with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ==========================================================================
  # Linting
  # ==========================================================================
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
          python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install linting tools
      run: |
          pip install flake8 black isort
    
      - name: Run flake8 (critical errors only)
      run: |
          flake8 backend/app scripts --count --select=E9,F63,F7,F82 --show-source --statistics
    
    - name: Check formatting with black
      run: |
          black --check --diff backend/app scripts || echo "::warning::Black formatting issues found"
        continue-on-error: true
    
    - name: Check imports with isort
      run: |
          isort --check-only --diff backend/app scripts || echo "::warning::Import sorting issues found"
        continue-on-error: true

  # ==========================================================================
  # Security Scan
  # ==========================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
          python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install security tools
      run: |
          pip install bandit safety pip-audit

      - name: Run bandit (security linter)
        run: |
          bandit -r backend/app -f json -o bandit-report.json -ll || true
          bandit -r backend/app -ll --format txt

      - name: Check dependencies with pip-audit
      run: |
          pip install -r backend/requirements.txt
          pip-audit --strict || echo "::warning::Dependency vulnerabilities found (backend requirements)"
        continue-on-error: true

      - name: Upload security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: bandit-report.json
          retention-days: 30

  # ==========================================================================
  # Docker Build Verification
  # ==========================================================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: rd-alpha-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: rd-alpha-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================================================
  # Python Compilation Check
  # ==========================================================================
  compile-check:
    name: Python Compile Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check all Python files compile
      run: |
          python -m compileall -q backend/app scripts
          echo "All Python files compile successfully"


