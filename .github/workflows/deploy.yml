# PATH: .github/workflows/deploy.yml
# PURPOSE: Production deployment workflow for R&D Alpha Research
# TRIGGERS: Push to main branch (after CI passes)

name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==========================================================================
  # Build and Push Docker Images
  # ==========================================================================
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      backend-tag: ${{ steps.meta-backend.outputs.tags }}
      frontend-tag: ${{ steps.meta-frontend.outputs.tags }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================================================
  # Deploy to Production Server
  # ==========================================================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/rd-alpha
            
            # Pull latest images
            docker pull ${{ needs.build-and-push.outputs.backend-tag }}
            docker pull ${{ needs.build-and-push.outputs.frontend-tag }}
            
            # Update docker-compose with new image tags
            export BACKEND_IMAGE="${{ needs.build-and-push.outputs.backend-tag }}"
            export FRONTEND_IMAGE="${{ needs.build-and-push.outputs.frontend-tag }}"
            
            # Rolling restart
            docker-compose pull
            docker-compose up -d --no-deps backend
            docker-compose up -d --no-deps frontend
            
            # Health check
            sleep 10
            curl -f http://localhost:8000/health || exit 1
            
            # Cleanup old images
            docker image prune -f

      - name: Notify deployment
        if: success()
        run: |
          echo "Deployment successful!"
          echo "Backend: ${{ needs.build-and-push.outputs.backend-tag }}"
          echo "Frontend: ${{ needs.build-and-push.outputs.frontend-tag }}"

  # ==========================================================================
  # Post-Deployment Verification
  # ==========================================================================
  verify:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Health check
        run: |
          # Wait for services to stabilize
          sleep 30
          
          # Check backend health
          curl -f https://research.finsoeasy.com/health || exit 1
          
          # Check frontend is serving
          curl -f https://research.finsoeasy.com/ || exit 1
          
          echo "All health checks passed!"

      - name: Smoke test API
        run: |
          # Test key API endpoints
          curl -f "https://research.finsoeasy.com/api/research/quintile-performance/5yr" || exit 1
          echo "API smoke tests passed!"

