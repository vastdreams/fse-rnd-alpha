# PATH: deploy/nginx.conf
# PURPOSE: Production Nginx configuration with security hardening
# USAGE: Mount in nginx container

# Security: Hide nginx version
server_tokens off;

# Security: Rate limiting zones
# Very permissive for research platform - frontend makes many concurrent API calls
# - Pages make 20-30 simultaneous requests on load
# - React Query refetches on window focus
# - 500r/s with burst 500 handles heavy page loads
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=500r/s;
limit_req_zone $binary_remote_addr zone=static_limit:10m rate=500r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Upstream backends
upstream backend {
    server backend:8000;
    keepalive 32;
}

# HTTP server - redirect to HTTPS (production) or serve locally (development)
server {
    listen 80;
    server_name research.finsoeasy.com;
    
    # Allow ACME challenge for cert renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Local development server (localhost only - no HTTPS redirect)
server {
    listen 80;
    server_name localhost;
    
    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    
    # Frontend static files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
    
    # API proxy
    location /api/ {
        proxy_pass http://backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Health check
    location = /health {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    
    # OpenAPI docs
    location ~ ^/(docs|redoc|openapi.json)$ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name research.finsoeasy.com;
    
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    
    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    
    # HSTS - enforce HTTPS for 1 year
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    
    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;
    
    # Security: Maximum request body size
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    
    # Security: Buffer settings
    client_body_buffer_size 1k;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 1k;
    
    # Security: Limit connections per IP (increased for heavy API usage)
    limit_conn conn_limit 100;
    
    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: https://www.googletagmanager.com https://www.google-analytics.com; connect-src 'self' https://research.finsoeasy.com https://www.google-analytics.com https://www.googletagmanager.com https://analytics.google.com https://region1.google-analytics.com;" always;
    
    # Cache-busted static assets (Vite adds content hashes like index-DfOMKWzk.js)
    # These can be cached forever since filenames change when content changes
    location ~* ^/assets/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        limit_req zone=static_limit burst=300 nodelay;
    }
    
    # Other static files (favicon, logos, etc.) - cache for 1 day, revalidate
    location ~* \.(ico|png|jpg|jpeg|gif|svg|woff|woff2)$ {
        root /usr/share/nginx/html;
        expires 1d;
        add_header Cache-Control "public, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        limit_req zone=static_limit burst=300 nodelay;
    }
    
    # Frontend SPA - serve index.html for all routes (never cache)
    # Users always get the latest version which references the new hashed assets
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        
        limit_req zone=static_limit burst=300 nodelay;
        
        # No-cache headers ensure browsers always fetch fresh index.html
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: https://www.googletagmanager.com https://www.google-analytics.com; connect-src 'self' https://research.finsoeasy.com https://www.google-analytics.com https://www.googletagmanager.com https://analytics.google.com https://region1.google-analytics.com;" always;
    }
    
    # API proxy
    # NOTE: Snapshot builds can be compute-heavy (FM + spanning + robustness). We allow a longer
    # upstream timeout for the explicit build endpoint only, while keeping the general API
    # timeouts tight to avoid hanging connections.
    location = /api/research/publication-snapshot/build {
        limit_req zone=api_limit burst=50 nodelay;
        limit_req_status 429;

        proxy_pass http://backend/api/research/publication-snapshot/build;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        proxy_buffer_size 16k;
        proxy_buffers 16 16k;
    }

    location /api/ {
        limit_req zone=api_limit burst=500 nodelay;
        limit_req_status 429;
        
        proxy_pass http://backend/api/;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }
    
    # Health check endpoint
    location = /health {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    
    # OpenAPI docs
    location ~ ^/(docs|redoc|openapi.json)$ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    # Block sensitive paths
    location ~ /\. {
        deny all;
        return 404;
    }
    
    location ~ ^/(\.env|\.git|\.htaccess|\.htpasswd|\.aws) {
        deny all;
        return 404;
    }
    
    # Block common attack vectors (but allow our /admin route which is a React SPA page)
    location ~ ^/(wp-admin|wp-login|xmlrpc|phpmyadmin|administrator) {
        deny all;
        return 404;
    }
    
    error_page 429 /429.html;
    location = /429.html {
        internal;
        default_type application/json;
        return 429 '{"error": "Too Many Requests", "message": "Rate limit exceeded. Please slow down."}';
    }
    
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        internal;
        default_type application/json;
        return 503 '{"error": "Service Unavailable", "message": "The service is temporarily unavailable."}';
    }
}

