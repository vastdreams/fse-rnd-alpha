# PATH: deploy/docker-compose.yml
# PURPOSE: Canonical immutable-image production stack for R&D Factor Analysis.
# USAGE: BACKEND_IMAGE=... FRONTEND_IMAGE=... docker compose up -d
#
# Images are built and pinned by CI. Local development belongs in the root
# docker-compose.yml; do not add build: blocks here or deploy a dirty checkout.

name: rd-alpha

x-backend-environment: &backend-environment
  # Do not interpolate POSTGRES_PASSWORD into a URL: valid passwords can
  # contain @, :, or / and must be URL-encoded. The host supplies the complete
  # internal-only DSN separately from the raw postgres service password.
  DATABASE_URL: ${BACKEND_DATABASE_URL:?BACKEND_DATABASE_URL must be set with a URL-encoded password}
  # When REDIS_PASSWORD is set, set REDIS_URL to redis://:<password>@redis:6379/0.
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  S3_BUCKET: ${S3_BUCKET:-fse-rnd-alpha-data}
  # Rendered two-page brief artifacts (content-addressed PDFs); the export
  # endpoint re-verifies the ledger sha256 on every download.
  REPORT_ARTIFACT_BUCKET: ${REPORT_ARTIFACT_BUCKET:-}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_REGION: ${AWS_REGION:-us-east-1}
  SEC_USER_AGENT: ${SEC_USER_AGENT:?SEC_USER_AGENT must be set}
  FMP_API_KEY: ${FMP_API_KEY:-}
  ALPHAVANTAGE_API_KEY: ${ALPHAVANTAGE_API_KEY:-}
  NASDAQ_DATA_LINK_API_KEY: ${NASDAQ_DATA_LINK_API_KEY:-}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  AUTH_SEED_EMAIL: ${AUTH_SEED_EMAIL:-}
  AUTH_SEED_PASSWORD: ${AUTH_SEED_PASSWORD:-}
  AUTH_SECONDARY_SEED_EMAIL: ${AUTH_SECONDARY_SEED_EMAIL:-}
  AUTH_SECONDARY_SEED_PASSWORD: ${AUTH_SECONDARY_SEED_PASSWORD:-}
  AUTH_USERS_PATH: /app/data/auth_users.json
  AUTH_PUBLIC_REGISTRATION: ${AUTH_PUBLIC_REGISTRATION:-true}
  AUTH_REQUIRE_EMAIL_VERIFICATION: ${AUTH_REQUIRE_EMAIL_VERIFICATION:-true}
  DEBUG: "false"
  # Staging/production: fail closed on rank enrich math breaks. Set 0 only as an
  # explicit emergency override — never rely on DEBUG for this gate.
  RANK_INVARIANT_FAIL_CLOSED: ${RANK_INVARIANT_FAIL_CLOSED:-1}
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in deploy .env}
  API_KEY_REQUIRED: ${API_KEY_REQUIRED:-false}
  FINSOEASY_EMAIL_PASSWORD: ${FINSOEASY_EMAIL_PASSWORD:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-}
  AUTH_RESET_URL: ${AUTH_RESET_URL:?AUTH_RESET_URL must be set}
  AUTH_VERIFY_URL: ${AUTH_VERIFY_URL:?AUTH_VERIFY_URL must be set}
  AUTH_SEED_ROLE: ${AUTH_SEED_ROLE:-user}
  AUTH_SECONDARY_SEED_ROLE: ${AUTH_SECONDARY_SEED_ROLE:-user}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.05}
  # Passed by the immutable release agent, never inferred from a mutable host
  # checkout. Readiness exposes and validates this identity against the sealed
  # database universe.
  RELEASE_REF: ${RELEASE_REF:-}
  RELEASE_SOURCE_SHA: ${RELEASE_SHA:-}
  RELEASE_BACKEND_IMAGE: ${BACKEND_IMAGE:-}
  RELEASE_FRONTEND_IMAGE: ${FRONTEND_IMAGE:-}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:?STRIPE_SUCCESS_URL must be set}
  STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:?STRIPE_CANCEL_URL must be set}

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f
    container_name: rd_alpha_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rd_alpha
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in deploy .env}
      # Security: Limit connections
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # Security: Don't expose DB port externally in production
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Security: Read-only filesystem where possible
    read_only: false
    security_opt:
      - no-new-privileges:true

  # Redis for Celery (with optional auth)
  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: rd_alpha_redis
    restart: unless-stopped
    command: >
      sh -c '
        if [ -n "$${REDIS_PASSWORD:-}" ]; then
          redis-server --requirepass $${REDIS_PASSWORD}
        else
          redis-server
        fi
      '
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    # Don't expose to host in production - only internal network
    # ports:
    #   - "6379:6379"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping; else redis-cli ping; fi",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be set to an immutable CI image}
    container_name: rd_alpha_backend
    restart: unless-stopped
    environment: *backend-environment
    # Security: Don't expose backend directly in production - use nginx
    # ports:
    #   - "8000:8000"
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Immutable release data lives outside the Git checkout. It is restored
      # from DATA_RELEASE_URI before deployment, so data changes never make a
      # server checkout dirty.
      - ${DATA_DIR:?DATA_DIR must point to the restored external data volume}:/app/data:ro
      - ../papers:/app/papers:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true

  # Celery Worker for background tasks
  worker:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be set to an immutable CI image}
    container_name: rd_alpha_worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker -c 4 -l info
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ${DATA_DIR:?DATA_DIR must point to the restored external data volume}:/app/data:ro
    healthcheck:
      # Verify both the worker process and its broker control plane. A live
      # PID alone can conceal a wedged worker that no longer consumes work.
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping --timeout=5 2>/dev/null | python -c \"import sys; raise SystemExit(0 if 'pong' in sys.stdin.read().lower() else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true

  # Celery Beat for scheduled tasks
  beat:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be set to an immutable CI image}
    container_name: rd_alpha_beat
    restart: unless-stopped
    command: celery -A app.workers.celery_app beat -l info
    environment: *backend-environment
    depends_on:
      worker:
        condition: service_started
    volumes:
      - ${DATA_DIR:?DATA_DIR must point to the restored external data volume}:/app/data:ro
    healthcheck:
      # Beat has no inspect/ping control plane, so verify the scheduled-process
      # container and its Celery runtime are both still alive.
      test: ["CMD-SHELL", "celery --version >/dev/null && kill -0 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true

  # Nginx Reverse Proxy (handles frontend + API proxy with security)
  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE must be set to an immutable CI image}
    container_name: rd_alpha_frontend
    restart: unless-stopped
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?PUBLIC_HOSTNAME must be set}
      NGINX_ENVSUBST_FILTER: PUBLIC_HOSTNAME
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # SSL certificates (created by certbot)
      - ${CERTS_DIR:?CERTS_DIR must remain outside the Git checkout}:/etc/nginx/certs:ro
      # ACME challenge for cert renewal
      - ${CERTBOT_WEBROOT:?CERTBOT_WEBROOT must remain outside the Git checkout}:/var/www/certbot:ro
    depends_on:
      - backend
    healthcheck:
      # Mirror Dockerfile.frontend: IPv4 + Host localhost (not ::1 / not public vhost).
      test:
        [
          "CMD-SHELL",
          "wget -q --spider --header='Host: localhost' http://127.0.0.1/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      # The official nginx entrypoint renders the PUBLIC_HOSTNAME template
      # here before nginx starts. Keep the image immutable while giving that
      # generated runtime config a disposable writable location.
      - /etc/nginx/conf.d
      - /var/cache/nginx
      - /var/run

volumes:
  pg_data:
    name: rd_alpha_pg_data

networks:
  default:
    name: rd_alpha_network
