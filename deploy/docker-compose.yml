# PATH: deploy/docker-compose.yml
# PURPOSE: Full stack deployment for R&D Factor Analysis
# USAGE: docker-compose up -d

version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: rd_alpha_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rd_alpha
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # Security: Limit connections
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # Security: Don't expose DB port externally in production
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Security: Read-only filesystem where possible
    read_only: false
    security_opt:
      - no-new-privileges:true

  # Redis for Celery (with optional auth)
  redis:
    image: redis:7-alpine
    container_name: rd_alpha_redis
    restart: unless-stopped
    command: >
      sh -c '
        if [ -n "$${REDIS_PASSWORD:-}" ]; then
          redis-server --requirepass $${REDIS_PASSWORD}
        else
          redis-server
        fi
      '
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    # Don't expose to host in production - only internal network
    # ports:
    #   - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build: ../backend
    container_name: rd_alpha_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/rd_alpha
      REDIS_URL: redis://redis:6379/0
      S3_BUCKET: ${S3_BUCKET:-your-bucket}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-Research Bot contact@example.com}
      FMP_API_KEY: ${FMP_API_KEY:-}
      DEBUG: ${DEBUG:-false}
      SECRET_KEY: ${SECRET_KEY:-change-in-production}
      API_KEY_REQUIRED: ${API_KEY_REQUIRED:-false}
      FINSOEASY_EMAIL_PASSWORD: ${FINSOEASY_EMAIL_PASSWORD:-}
      # Stripe payment processing
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-https://research.finsoeasy.com/donate?success=true}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-https://research.finsoeasy.com/donate?canceled=true}
      # Resend email API
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    # Security: Don't expose backend directly in production - use nginx
    # ports:
    #   - "8000:8000"
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../data:/app/data
      - ../papers:/app/papers:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true

  # Celery Worker for background tasks
  worker:
    build: ../backend
    container_name: rd_alpha_worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker -c 4 -l info
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/rd_alpha
      REDIS_URL: redis://redis:6379/0
      S3_BUCKET: ${S3_BUCKET:-fse-rnd-alpha-data}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-FSE Research contact@example.com}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../data:/app/data

  # Celery Beat for scheduled tasks
  beat:
    build: ../backend
    container_name: rd_alpha_beat
    restart: unless-stopped
    command: celery -A app.workers.celery_app beat -l info
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/rd_alpha
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - worker

  # Nginx Reverse Proxy (handles frontend + API proxy with security)
  frontend:
    image: nginx:alpine
    container_name: rd_alpha_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      # SSL certificates (created by certbot)
      - ./certs:/etc/nginx/certs:ro
      # ACME challenge for cert renewal
      - ./certbot-webroot:/var/www/certbot:ro
    depends_on:
      - backend
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run

volumes:
  pg_data:
    name: rd_alpha_pg_data

networks:
  default:
    name: rd_alpha_network
